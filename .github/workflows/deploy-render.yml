name: Deploy Back to Render

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-render:
    name: Build, Archive & Deploy API
    # Condition stricte sur la branche main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ---  PLAN B  ---
      - name: Création de l'archive de secours
        run: zip -r dist-server.zip . -x "node_modules/*" ".git/*"

      - name: Upload de l'artefact serveur
        uses: actions/upload-artifact@v4
        with:
          name: dist-server
          path: dist-server.zip
          
      # --- LE DÉPLOIEMENT RENDER ---
      - name: Déclenchement du déploiement Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }} # L'ID du Web Service sur Render
          [cite_start]api-key: ${{ secrets.RENDER_API_KEY }}       # La clé secrète Render [cite: 131]